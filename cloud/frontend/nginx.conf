server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router owns the URL space, so unknown paths return the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Everything the app calls goes to the API Gateway, never to a service
    # directly. Serving both from one origin also means no CORS in production.
    location /api/ {
        proxy_pass http://api-gateway:8080;
        proxy_http_version 1.1;
        # $http_host keeps the port the browser used (e.g. 10.125.61.42:5273).
        # With $host the port is stripped, so the gateway compared
        # "Origin: http://host:5273" against "http://host" and rejected the
        # request as cross-origin (403) even though it was same-origin.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # STOMP over WebSocket (with the SockJS fallback transports).
    location /ws {
        proxy_pass http://api-gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Same reasoning as /api/: keep the original port so the upgrade
        # request stays same-origin at the gateway.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
